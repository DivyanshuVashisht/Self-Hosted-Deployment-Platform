# Default values for self-hosted-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: self-hosted-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
    # kubernetes.io/ingress.class: traefik
  hosts:
    - host: self-hosted-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: self-hosted-app-tls
  #    hosts:
  #      - self-hosted-app.local

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  PORT: "8080"
  APP_VERSION: "1.0.0"

serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics
