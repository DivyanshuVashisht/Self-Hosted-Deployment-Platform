apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "self-hosted-app.fullname" . }}
  labels:
    {{- include "self-hosted-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "self-hosted-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "self-hosted-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: APP_VERSION
              value: {{ .Values.env.APP_VERSION | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.env.PORT | default "8080" | int }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
